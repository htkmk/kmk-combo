<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>クラシックJP</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>クラシックJP コンボ</h1>

  <label>位置：</label>
  <select id="position">
    <option value="">すべて</option>
    <option value="端背負わせ">端背負わせ</option>
    <option value="端背負わせ付近">端背負わせ付近</option>
    <option value="中央">中央</option>
    <option value="端背負い付近">端背負い付近</option>
    <option value="端背負い">端背負い</option>
  </select>

  <label>使用用途：</label>
  <select id="purpose">
    <option value="">すべて</option>
    <option value="ダメージ重視">ダメージ重視</option>
    <option value="状況重視">状況重視</option>
    <option value="運び重視">運び重視</option>
  </select>

  <label>ドライブゲージ：</label>
  <select id="drive">
    <option value="">すべて</option>
    <option value="0">０本</option>
    <option value="1">１本</option>
    <option value="2">２本</option>
    <option value="3">３本</option>
    <option value="4">４本</option>
    <option value="5">５本</option>
    <option value="6">６本</option>
  </select>

  <label>SAゲージ：</label>
  <select id="sa">
    <option value="">すべて</option>
    <option value="0">０ゲージ</option>
    <option value="1">１ゲージ</option>
    <option value="2">２ゲージ</option>
    <option value="3">３ゲージ</option>
  </select>

  <label>始動技：</label>
  <select id="starter">
    <option value="">すべて</option>
    <option value="インパクトパニカン">インパクトパニカン</option>
    <option value="スタン">スタン</option>
  </select>

  <hr>

  <div id="result"></div>

  <p><a href="classic-jp.html">← クラシックJPページに戻る</a></p>
  <p><a href="index.html">← トップに戻る</a></p>

  <script>
    const combos = [
      {
        combo: "インパクトパ二カン > 歩き5大P > 強ストリボーグ > 中トルバラン > 強トリグラフ",
        position: ["端背負い","端背負い付近","中央"],
        purpose: ["ダメージ重視"],
        drive: 0,
        sa: 0,
        starter: ["インパクトパニカン"],
        note: "3160ダメージ。インパクトパ二カン時にノーゲージでダメージを取りたい時はこれ一択。強トリグラフ後は各種ヴィーハトが安全にできる。"
      },
      {
        combo: "インパクトパ二カン > 歩き5大P > 強ストリボーグ > 中トルバラン > 強ヴィーハト",
        position: ["端背負い","端背負い付近","中央"],
        purpose: ["状況重視"],
        drive: 0,
        sa: 0,
        starter: ["インパクトパニカン"],
        note: "2760ダメージ。インパクトパ二カン時にDゲージ回復がしたい時はこれ一択。強ヴィーハトの後は３連強トリグラフで固めることができ、１回目、２回目にパリィを押す相手にはアクノ派生から投げがパ二カンする。"
      },
      {
        combo: "インパクトパ二カン > 歩き5大P > 強ストリボーグ > 前ステップ > ラッシュ6大K > 強トリグラフ",
        position: ["端背負い","端背負い付近","中央"],
        purpose: ["運び重視"],
        drive: 1,
        sa: 0,
        starter: ["インパクトパニカン"],
        note: "2955ダメージ。わずか１ゲージで使える超優秀な運びコンボ。強トリグラフの後はODヴィーハトが安全にできるため、３ゲージ使えるときは有利状況を継続できる。"
      },
      {
        combo: "インパクトパ二カン > 歩き5大P > 強ストリボーグ > 中トルバラン > 中強ODトリグラフ > SA2 > 強ヴィーハト > 前ジャンプ > 前ステップ > 中ストリボーグ > 中ストリボーグ",
        position: ["端背負い","端背負い付近","中央"],
        purpose: ["ダメージ重視"],
        drive: 2,
        sa: 2,
        starter: ["インパクトパニカン"],
        note: "ダメージ。コンボの途中までSA2を使うか否かを考えられる上高火力なリーサルコンボ。"
      },
      {
        combo: "インパクトパ二カン > 中強ODヴィーハト > 2小P > 中ストリボーグ > 前ステップ > 前ステップ > 前ジャンプ中K > 5大P > 強トリグラフ",
        position: ["端背負い付近","中央"],
        purpose: ["運び重視"],
        drive: 2,
        sa: 0,
        starter: ["インパクトパニカン"],
        note: "3500ダメージ。わずか2ゲージで運びもダメージも良いという超優秀コンボ。"
      },
      {
        combo: "インパクトパ二カン > 中強ODヴィーハト > 2小P > 中ストリボーグ > 前ステップ > 前ステップ > 後ろジャンプ中K > 5大P > 強トリグラフ",
        position: ["端背負い"],
        purpose: ["状況重視"],
        drive: 2,
        sa: 0,
        starter: ["インパクトパニカン"],
        note: "3500ダメージ。わずか2ゲージでSAすら使わずに入れ替えられる超優秀コンボ。"
      },
      {
        combo: "インパクトパ二カン > 弱強ODヴィーハト > 5小P > 6大K > 中アクノ > ジャンプ中K > ラッシュ6大K > 5大P > 弱トリグラフ",
        position: ["端背負い","端背負い付近"],
        purpose: ["状況重視"],
        drive: 3,
        sa: 0,
        starter: ["インパクトパニカン"],
        note: "ダメージ。3ゲージ使うが、SAは使わず端からの距離も気にする必要がない、汎用性の高い入れ替えコンボ。"
      },
      {
        combo: "インパクトパ二カン > ジラント(5大K > 5大P) > SA2 > 2中K > 前ジャンプ > 2大P > 中ヴィーハト > ジラント(5大K > 5大P) > 弱トルバラン > 前ステップ > 6大K > 中ストリボーグ > 5大P > 強ヴィーハト",
        position: ["端背負い","端背負い付近"],
        purpose: ["状況重視"],
        drive: 1,
        sa: 2,
        starter: ["インパクトパニカン"],
        note: "ダメージ。SA2を使うが、ゲージを回復しつつ入れ替えれる、状況好転コンボ。"
      },
      {
        combo: "インパクトパ二カン > ジラント(5大K > 5大P) > SA2 > 2中K > 前ジャンプ > 2大P > 強ヴィーハト > 5大P > インパクト > 6大K > 中ストリボーグ > 5大P > 強トリグラフ",
        position: ["端背負い","端背負い付近"],
        purpose: ["状況重視"],
        drive: 1,
        sa: 2,
        starter: ["インパクトパニカン"],
        note: "ダメージ。1ゲージとSA2を使うが、入れ替わるわゲージは削るわ起き攻めが付くわといいことがたくさん起きるコンボ。インパクト後の6大Kは画面端からの距離によっては前ステップしてから出したり、ラッシュから出す必要がある。後者の場合にはその後がラッシュ6大K > 弱トルバラン > 6大K > 中ストリボーグ > 5大P > 強トリグラフとなり、ダメージ伸びる。"
      },
      {
        combo: "インパクトパ二カン > 中強ODヴィーハト > 2小P > 中ストリボーグ > 歩き中強ODヴィーハト > 5大P > 強トルバラン > バックステップ > 中トルバラン > 強トリグラフ > SA3",
        position: ["端背負い"],
        purpose: ["ダメージ重視"],
        drive: 4,
        sa: 3,
        starter: ["インパクトパニカン"],
        note: "ダメージ。4ゲージとSA3を犠牲に画面端を背負った状態から高火力を出す、見栄えのいいリーサル限定コンボ。"
      },
      {
        combo: "インパクトパ二カン > ジラント(5大K > 5大P) > SA2 > 2中K > 5大K > 2大P > 強ヴィーハト > ジラント(5大K > 5大P) > 弱トリグラフ > 強ストリボーグ > 中トルバラン > 強トリグラフ",
        position: ["中央"],
        purpose: ["状況重視"],
        drive: 4,
        sa: 3,
        starter: ["インパクトパニカン"],
        note: "ダメージ。SA2を犠牲に異様なまでのゲージ回収とそれなりのダメージを両立する優秀コンボ。"
      }
    ];

    function renderCombos() {
      const starter = document.getElementById("starter").value;
      const position = document.getElementById("position").value;
      const purpose = document.getElementById("purpose").value;
      const drive = document.getElementById("drive").value;
      const sa = document.getElementById("sa").value;

      const filtered = combos.filter(c => {
        return (starter === "" || c.starter.includes(starter)) &&
               (position === "" || c.position.includes(position)) &&
               (purpose === "" || c.purpose.includes(purpose)) &&
               (drive === "" || Number(drive) >= c.drive) &&
               (sa === "" || Number(sa) === Number(c.sa))
      });

      const result = document.getElementById("result");

      if (filtered.length === 0) {
        result.innerHTML = "<p>該当なし</p>";
        return;
      }

      result.innerHTML = filtered.map(c => `
        <div class="combo-card">
          <h2>${c.combo}</h2>
          <p>位置: ${c.position.join(" / ")}</p>
          <p>使用用途: ${c.purpose.join(" / ")}</p>
          <p>必要ドライブゲージ: ${c.drive}</p>
          <p>必要SAゲージ: ${c.sa}</p>
          <p>始動技: ${c.starter.join(" / ")}</p>
          <p class="note">${c.note}</p>
        </div>
      `).join("");
    }

    document.getElementById("position").addEventListener("change", renderCombos);
    document.getElementById("purpose").addEventListener("change", renderCombos);
    document.getElementById("drive").addEventListener("change", renderCombos);
    document.getElementById("sa").addEventListener("change", renderCombos);
    document.getElementById("starter").addEventListener("change", renderCombos);

    renderCombos();
  </script>

</body>
</html>
