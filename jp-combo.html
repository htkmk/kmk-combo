<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>クラシックJP コンボルート作成</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>クラシックJP コンボルート作成</h1>

  <div class="combo-card">
    <h2>条件選択</h2>

    <label>ヒット位置：</label>
    <select id="hitType">
      <option value="">選択してください</option>
      <option value="地上ヒット">地上ヒット</option>
      <option value="空中ヒット">空中ヒット</option>
    </select>

    <label>始動状態：</label>
    <select id="hitState">
      <option value="">選択してください</option>
      <option value="通常ヒット">通常ヒット</option>
      <option value="カウンター">カウンター</option>
      <option value="パニカン">パニカン</option>
    </select>

    <label>所持ドライブゲージ：</label>
    <select id="drive"></select>

    <label>所持SAゲージ：</label>
    <select id="sa"></select>

    <label>画面端からの距離：</label>
    <select id="position">
      <option value="">選択してください</option>
      <option value="端背負い">端背負い</option>
      <option value="端背負い付近">端背負い付近</option>
      <option value="中央">中央</option>
      <option value="端背負わせ付近">端背負わせ付近</option>
      <option value="端背負わせ">端背負わせ</option>
    </select>
  </div>

  <div class="combo-card">
    <h2>コンボルート</h2>

    <div id="routeArea" class="route-area">
      <select id="starter">
        <option value="">始動技を選択</option>
        <option value="インパクト">インパクト</option>
      </select>
    </div>
  </div>

  <div class="combo-card">
    <h2>現在のルート</h2>
    <p id="currentRoute">まだ始動技が選ばれていません。</p>
    <p id="currentDamage">現在のダメージ：0</p>
  </div>

  <p><a href="classic-jp.html">← クラシックJPページに戻る</a></p>
  <p><a href="index.html">← トップに戻る</a></p>

  <script>
    // ドライブゲージ生成
    const driveSelect = document.getElementById("drive");

    driveSelect.innerHTML =
      `<option value="">選択してください</option>`;

    for (let i = 0; i <= 6; i += 0.5) {
      const option = document.createElement("option");

      option.value = i.toFixed(1);
      option.textContent = i.toFixed(1);

      driveSelect.appendChild(option);
    }

    // SAゲージ生成
    const saSelect = document.getElementById("sa");

    saSelect.innerHTML =
      `<option value="">選択してください</option>`;

    for (let i = 0; i <= 3.01; i += 0.1) {
      const option = document.createElement("option");

      option.value = i.toFixed(1);
      option.textContent = i.toFixed(1);

      saSelect.appendChild(option);
    }
    
    const impactPanishMoves = [
      "立ち小P", "立ち中P", "立ち大P",
      "立ち小K", "立ち中K", "立ち大K",
      "しゃがみ小P", "しゃがみ中P", "しゃがみ大P",
      "しゃがみ小K", "しゃがみ中K", "しゃがみ大K",
      "ジャンプ小P", "ジャンプ中P", "ジャンプ大P",
      "ジャンプ小K", "ジャンプ中K", "ジャンプ大K"
    ];

    const allPositions = [
      "端背負い",
      "端背負い付近",
      "中央",
      "端背負わせ付近",
      "端背負わせ"
    ];

    const starterDamages = {
      "インパクト": 800
    };

    const routes = [
      ...impactPanishMoves.map(move => ({
        route: ["インパクト"],
        to: move,
        damage: 800,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: allPositions,
        drive: 0,
        sa: 0
      })),

      {
        route: ["インパクト", "ジャンプ大K"],
        to: "6大K",
        damage: 800,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 0
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K"],
        to: "中ストリボーグ",
        damage: 1200,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 0
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ"],
        to: "5大P",
        damage: 800,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 0
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P"],
        to: "通常ヴィーハト",
        damage: 0,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 0
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P"],
        to: "中ストリボーグ",
        damage: 1200,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 0
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "中ストリボーグ"],
        to: "前ジャンプ",
        damage: 0,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 0
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P"],
        to: "通常トリグラフ",
        damage: 800,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 1
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "通常トリグラフ"],
        to: "SA1",
        damage: 2000,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 1
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P"],
        to: "SA2",
        damage: 2000,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 2
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "SA2"],
        to: "弱ストリボーグ",
        damage: 1000,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 2
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "SA2", "弱ストリボーグ"],
        to: "通常ヴィーハト",
        damage: 800,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 2
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "SA2", "弱ストリボーグ", "通常ヴィーハト"],
        to: "中ストリボーグ",
        damage: 1200,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 2
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "SA2", "弱ストリボーグ", "通常ヴィーハト", "中ストリボーグ"],
        to: "通常トリグラフ",
        damage: 800,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 2
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "SA2", "弱ストリボーグ", "通常ヴィーハト", "中ストリボーグ", "通常トリグラフ"],
        to: "通常トリグラフ",
        damage: 800,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 2
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "SA2", "弱ストリボーグ", "通常ヴィーハト", "中ストリボーグ", "通常トリグラフ", "通常トリグラフ"],
        to: "弱ストリボーグ",
        damage: 1000,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 2
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "SA2", "弱ストリボーグ", "通常ヴィーハト", "中ストリボーグ", "通常トリグラフ", "通常トリグラフ"],
        to: "SA1",
        damage: 2000,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 3
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P"],
        to: "弱トルバラン",
        damage: 800,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 3
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "弱トルバラン"],
        to: "SA3",
        damage: 4000,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 3
      },
      {
        route: ["インパクト", "ジャンプ大K", "6大K", "中ストリボーグ", "5大P", "弱トルバラン"],
        to: "CA",
        damage: 4500,
        hitType: ["地上ヒット"],
        hitState: ["パニカン"],
        position: ["端背負わせ"],
        drive: 0,
        sa: 3
      }
    ];

    let currentRoute = [];

    function getConditions() {
      return {
        hitType: document.getElementById("hitType").value,
        hitState: document.getElementById("hitState").value,
        drive: document.getElementById("drive").value,
        sa: document.getElementById("sa").value,
        position: document.getElementById("position").value
      };
    }

    function isSameRoute(routeData, selectedRoute) {
      return routeData.length === selectedRoute.length &&
             routeData.every((move, index) => move === selectedRoute[index]);
    }

    function canUseRoute(route, conditions) {
      return conditions.hitType !== "" &&
             conditions.hitState !== "" &&
             conditions.drive !== "" &&
             conditions.sa !== "" &&
             conditions.position !== "" &&
             route.hitType.includes(conditions.hitType) &&
             route.hitState.includes(conditions.hitState) &&
             route.position.includes(conditions.position) &&
             Number(conditions.drive) >= Number(route.drive) &&
             Number(conditions.sa) >= Number(route.sa);
    }

    function resetRoute() {
      currentRoute = [];

      const routeArea = document.getElementById("routeArea");

      while (routeArea.children.length > 1) {
        routeArea.removeChild(routeArea.lastChild);
      }

      updateRouteText();
    }

    function startRoute() {
      const starter = document.getElementById("starter").value;

      resetRoute();

      if (starter === "") {
        return;
      }

      currentRoute.push(starter);
      
      updateRouteText();
      updateDamage();
      
      createNextSelect();
    }

    function createNextSelect() {
      const conditions = getConditions();

      const candidates = routes.filter(route => {
        return isSameRoute(route.route, currentRoute) &&
               canUseRoute(route, conditions);
      });

      if (candidates.length === 0) {
        return;
      }

      const arrow = document.createElement("span");
      arrow.className = "route-arrow";
      arrow.textContent = "＞";

      const select = document.createElement("select");
      select.innerHTML = `<option value="">次の技を選択</option>`;

      candidates.forEach(route => {
        const option = document.createElement("option");
        option.value = route.to;
        option.textContent = route.to;
        select.appendChild(option);
      });

      select.addEventListener("change", function() {
        if (this.value === "") return;

        const allSelects = Array.from(document.querySelectorAll("#routeArea select"));
        const selectIndex = allSelects.indexOf(select);

        currentRoute = currentRoute.slice(0, selectIndex);
        currentRoute.push(this.value);
        
        updateRouteText();
        updateDamage();

        let next = select.nextSibling;
        while (next) {
          const removeTarget = next;
          next = next.nextSibling;
          removeTarget.remove();
        }

        createNextSelect();
      });

      const routeArea = document.getElementById("routeArea");
      routeArea.appendChild(arrow);
      routeArea.appendChild(select);
    }

    function updateRouteText() {
      const routeText = document.getElementById("currentRoute");

      if (currentRoute.length === 0) {
        routeText.textContent = "まだ始動技が選ばれていません。";
      } else {
        routeText.textContent = currentRoute.join(" > ");
      }
    }

    function updateDamage() {
      let total = 0;

      // 始動技ダメージ
      if (currentRoute.length > 0) {
        total += starterDamages[currentRoute[0]] || 0;
      }

      // ルート技ダメージ
      for (let i = 1; i < currentRoute.length; i++) {
        const beforeRoute = currentRoute.slice(0, i);
        const currentMove = currentRoute[i];

        const routeData = routes.find(route => {
          return isSameRoute(route.route, beforeRoute) &&
          route.to === currentMove;
        });

        if (routeData && routeData.damage) {
          total += routeData.damage;
        }
      }

      document.getElementById("currentDamage").textContent =
      `現在のダメージ：${total}`;
    }

    document.getElementById("hitType").addEventListener("change", startRoute);
    document.getElementById("starter").addEventListener("change", startRoute);
    document.getElementById("hitState").addEventListener("change", startRoute);
    document.getElementById("drive").addEventListener("change", startRoute);
    document.getElementById("sa").addEventListener("change", startRoute);
    document.getElementById("position").addEventListener("change", startRoute);
  </script>

</body>
</html>
